[platformio]
default_envs = integrated

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
monitor_filters =
  time
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  adafruit/Adafruit INA219
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  madhephaestus/ESP32Servo

[env:button_test]
build_flags =
  ${env.build_flags}
  -D APP_MODE_BUTTON_TEST

[env:i2c_scan]
build_flags =
  ${env.build_flags}
  -D APP_MODE_I2C_SCAN

[env:oled_test]
build_flags =
  ${env.build_flags}
  -D APP_MODE_OLED_TEST

[env:ina219_test]
build_flags =
  ${env.build_flags}
  -D APP_MODE_INA219_TEST

[env:dht_test]
build_flags =
  ${env.build_flags}
  -D APP_MODE_DHT_TEST

[env:fan_pwm_test]
build_flags =
  ${env.build_flags}
  -D APP_MODE_FAN_PWM_TEST

[env:servo_test]
build_flags =
  ${env.build_flags}
  -D APP_MODE_SERVO_TEST

[env:integrated]
build_flags =
  ${env.build_flags}
  -D APP_MODE_INTEGRATED
